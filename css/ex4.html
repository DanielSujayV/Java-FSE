<!DOCTYPE html>
<html>
<head>
    <title>Color and Background Styling</title>

    <style>

        body{
            background-color: #dfefff;
            background-image: url("city-bg.jpg");
            background-size: cover;
            font-family: Arial;
        }

        h1{
            color: #003366;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            padding: 15px;
        }

        .content{
            background-color: rgba(255,255,255,0.8);
            padding: 20px;
            margin: 20px;
        }

    </style>
</head>

<body>

    <h1>Local Community Portal</h1>

    <div class="content">
        <p>
            Welcome to the city events portal where residents can
            stay updated about upcoming programs and activities.
        </p>
    </div>

</body>
</html>
