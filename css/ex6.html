<!DOCTYPE html>
<html>
<head>

    <title>Links and Lists</title>

    <style>

        a:link{
            color: blue;
            text-decoration: none;
        }

        a:hover{
            color: green;
        }

        a:active{
            color: red;
        }

        a:visited{
            color: purple;
        }

        ul{
            list-style-type: none;
            padding: 0;
        }

        li{
            margin: 10px;
            padding: 8px;
            display: inline-block;
        }

    </style>

</head>

<body>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Events</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

</body>
</html>
