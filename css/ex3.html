<!DOCTYPE html>
<html>
<head>

    <title>CSS Selectors</title>

    <style>

        /* Universal selector */

        *{
            margin: 0;
            padding: 0;
        }

        /* Element selector */

        h2{
            color: darkgreen;
            margin: 15px;
        }

        /* ID selector */

        #mainHeader{
            background-color: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Class selector */

        .eventCard{
            border: 2px solid gray;
            padding: 15px;
            margin: 20px;
        }

        /* Grouping selector */

        h3, p{
            font-family: Arial;
            color: #444;
        }

    </style>

</head>

<body>

    <div id="mainHeader">
        <h1>Local Community Portal</h1>
    </div>

    <h2>Upcoming Events</h2>

    <div class="eventCard">

        <h3>Food Festival</h3>

        <p>
            Join us for delicious local dishes and activities.
        </p>

    </div>

</body>
</html>
