<!DOCTYPE html>
<html>
<head>

    <title>Styled Table</title>

    <style>

        table{
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        th{
            background-color: #004466;
            color: white;
            padding: 12px;
        }

        td{
            border: 1px solid gray;
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even){
            background-color: #f2f2f2;
        }

    </style>

</head>

<body>

    <table>

        <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>

        <tr>
            <td>Music Show</td>
            <td>June 10</td>
            <td>Town Hall</td>
        </tr>

        <tr>
            <td>Food Festival</td>
            <td>June 15</td>
            <td>City Park</td>
        </tr>

    </table>

</body>
</html>
