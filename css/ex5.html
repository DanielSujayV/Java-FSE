<!DOCTYPE html>
<html>
<head>

    <title>Typography Styling</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
    rel="stylesheet">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }

        h1{
            font-size: 38px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
        }

        p{
            font-size: 18px;
            line-height: 1.8;
            font-style: italic;
            text-align: justify;
        }

    </style>

</head>

<body>

    <h1>Community Events</h1>

    <p>
        This portal helps citizens stay connected with local
        activities, awareness campaigns and cultural celebrations.
    </p>

</body>
</html>
