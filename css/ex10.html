<!DOCTYPE html>
<html>
<head>

    <title>Responsive Design</title>

    <style>

        body{
            margin: 0;
            font-family: Arial;
        }

        nav{
            display: flex;
            background-color: teal;
            padding: 10px;
        }

        nav a{
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }

        img{
            width: 40vw;
        }

        @media screen and (max-width: 768px){

            nav{
                flex-direction: column;
            }

            nav a{
                margin: 10px 0;
            }

            img{
                width: 80vw;
            }

            h1{
                font-size: 22px;
            }

        }

    </style>

</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Events</a>
        <a href="#">Contact</a>
    </nav>

    <h1>Responsive Community Portal</h1>

    <img src="event.jpg" alt="event image">

</body>
</html>
