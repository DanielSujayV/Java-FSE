<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Buttons</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-4">

   

    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-info">Info</button>
    <button class="btn btn-light">Light</button>
    <button class="btn btn-dark">Dark</button>

    <hr>

    <h2>Outline Buttons</h2>

    <button class="btn btn-outline-primary">Outline Primary</button>
    <button class="btn btn-outline-secondary">Outline Secondary</button>
    <button class="btn btn-outline-success">Outline Success</button>
    <button class="btn btn-outline-danger">Outline Danger</button>
    <button class="btn btn-outline-warning">Outline Warning</button>
    <button class="btn btn-outline-info">Outline Info</button>

    <hr>

 

    <div class="btn-group" role="group">

        <button type="button" class="btn btn-primary">
            Left
        </button>

        <button type="button" class="btn btn-primary">
            Middle
        </button>

        <button type="button" class="btn btn-primary">
            Right
        </button>

    </div>

    <hr>

    <h2>Toggle Buttons with Checkboxes</h2>

    <input type="checkbox" class="btn-check" id="check1" autocomplete="off">

    <label class="btn btn-outline-primary" for="check1">
        Option 1
    </label>

    <input type="checkbox" class="btn-check" id="check2" autocomplete="off">

    <label class="btn btn-outline-success" for="check2">
        Option 2
    </label>

    <input type="checkbox" class="btn-check" id="check3" autocomplete="off">

    <label class="btn btn-outline-danger" for="check3">
        Option 3
    </label>

</div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
