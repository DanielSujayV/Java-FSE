<!DOCTYPE html>
<html>
<head>
    <title>Spacing Utilities</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="bg-primary text-white p-2 m-3">
        Section with m-3 and p-2
    </div>

    <div class="bg-success text-white py-5 mt-4">
        Section with mt-4 and py-5
    </div>

    <h2 class="mt-5 text-center">
        Pricing Plans
    </h2>

    <div class="row mt-4">

        <div class="col-md-4">

            <div class="card p-3">

                <h4>Basic</h4>
                <p>$10/month</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-3">

                <h4>Standard</h4>
                <p>$20/month</p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-3">

                <h4>Premium</h4>
                <p>$30/month</p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
