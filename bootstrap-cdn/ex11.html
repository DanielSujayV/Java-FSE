<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-5">



    <h2 class="mb-3">Profile Card</h2>

    <div class="card" style="width: 18rem;">

        <img
            src="https://via.placeholder.com/300x200"
            class="card-img-top"
            alt="Profile Image">

        <div class="card-body">

            <h5 class="card-title">
                John Doe
            </h5>

            <p class="card-text">
                Web Developer with experience in HTML, CSS, Bootstrap, and JavaScript.
            </p>

            <a href="#" class="btn btn-primary">
                View Profile
            </a>

        </div>

    </div>

    <hr class="my-5">

  

    <h2 class="mb-3">Media Object Layout</h2>

    <div class="d-flex align-items-start">

        <img
            src="https://via.placeholder.com/120"
            alt="User Image"
            class="me-3 rounded">

        <div>

            <h5>Article Title</h5>

            <p>
                This is an example of a media object layout.
                The image appears on the left while the content
                is displayed on the right.
            </p>

        </div>

    </div>

</div>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
