<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Colors</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="mb-4">
        Dashboard
    </h2>

    <div class="row">

        <div class="col-md-3">
            <div class="bg-primary text-white p-4">
                Users
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-success text-white p-4">
                Sales
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-warning text-dark p-4">
                Orders
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-danger text-white p-4">
                Alerts
            </div>
        </div>

    </div>

    <div class="bg-dark bg-gradient text-white p-5 mt-5">

        <h3>
            Gradient Section
        </h3>

        <p>
            Example of bg-dark with bg-gradient and white text.
        </p>

    </div>

</div>

</body>
</html>
