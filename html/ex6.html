<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>

    <style>
        body{
            font-family: Arial;
            padding: 20px;
        }

        img{
            width: 250px;
            transition: 0.3s;
        }
    </style>
</head>

<body>

<h2>Event Feedback</h2>

<label>Phone Number:</label>
<input type="text" id="phone"
onblur="validatePhone()">

<br><br>

<label>Select Event:</label>

<select onchange="showFee(this.value)">
    <option value="">Choose</option>
    <option value="100">Music Show</option>
    <option value="150">Food Festival</option>
</select>

<p id="fee"></p>

<button onclick="confirmSubmit()">Submit</button>

<br><br>

<img src="event.jpg"
ondblclick="enlargeImage(this)"
alt="event image">

<br><br>

<textarea id="feedback"
onkeyup="countChars()"
rows="5" cols="40"></textarea>

<p id="count">Characters: 0</p>

<script>

function validatePhone(){
    let phone = document.getElementById("phone").value;

    if(phone.length != 10){
        alert("Enter a valid 10 digit number");
    }
}

function showFee(value){
    document.getElementById("fee").innerHTML =
    "Event Fee: ₹" + value;
}

function confirmSubmit(){
    alert("Feedback submitted!");
}

function enlargeImage(img){
    img.style.width = "400px";
}

function countChars(){
    let text =
    document.getElementById("feedback").value;

    document.getElementById("count").innerHTML =
    "Characters: " + text.length;
}

</script>

</body>
</html>
