<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Community Event Gallery</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        table{
            margin: auto;
            border-spacing: 15px;
        }

        .event-img{
            width: 220px;
            height: 150px;
            border: 3px solid #444;
            border-radius: 8px;
        }

        caption{
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        td{
            text-align: center;
        }
    </style>
</head>

<body>

    <table>
        <caption>Memories from Our Community Events</caption>

        <tr>
            <td>
                <img src="event1.jpg" alt="Music Night"
                title="Music Night Celebration"
                class="event-img">
                <p>Music Night</p>
            </td>

            <td>
                <img src="event2.jpg" alt="Food Festival"
                title="Local Food Festival"
                class="event-img">
                <p>Food Festival</p>
            </td>

            <td>
                <img src="event3.jpg" alt="Sports Event"
                title="Annual Sports Meet"
                class="event-img">
                <p>Sports Meet</p>
            </td>
        </tr>

        <tr>
            <td>
                <img src="event4.jpg" alt="Book Fair"
                title="Community Book Fair"
                class="event-img">
                <p>Book Fair</p>
            </td>

            <td>
                <img src="event5.jpg" alt="Tree Plantation"
                title="Green Earth Campaign"
                class="event-img">
                <p>Tree Plantation</p>
            </td>

            <td>
                <img src="event6.jpg" alt="Dance Program"
                title="Cultural Dance Program"
                class="event-img">
                <p>Dance Program</p>
            </td>
        </tr>

    </table>

</body>
</html>
