<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Registration</title>

    <style>
        body{
            font-family: Verdana;
            background-color: #eef2f3;
        }

        .form-box{
            width: 400px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, select, textarea{
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        button{
            padding: 10px;
            background-color: teal;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h2>Community Event Registration</h2>

    <form onsubmit="showMessage(); return false;">

        <label>Name</label>
        <input type="text" placeholder="Enter your name"
        required autofocus>

        <label>Email</label>
        <input type="email" placeholder="Enter email"
        required>

        <label>Date</label>
        <input type="date" required>

        <label>Event Type</label>
        <select required>
            <option value="">Choose Event</option>
            <option>Music Show</option>
            <option>Sports Meet</option>
            <option>Food Festival</option>
        </select>

        <label>Message</label>
        <textarea placeholder="Write something..."></textarea>

        <button type="submit">Register</button>

        <br><br>

        <output id="result"></output>

    </form>

</div>

<script>

    function showMessage(){
        document.getElementById("result").innerHTML =
        "Registration submitted successfully!";
    }

</script>

</body>
</html>
